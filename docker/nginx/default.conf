server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/moodle;
    index index.php index.html;

    client_max_body_size 256M;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /r.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        set $path_info $fastcgi_path_info;

        try_files $fastcgi_script_name $fastcgi_script_name/ /r.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_index index.php;
        fastcgi_pass php:9000;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* /(composer\.(json|lock)|package\.json|phpunit\.xml|README|readme|UPGRADING)$ {
        deny all;
    }
}
